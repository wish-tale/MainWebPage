    --bg:   url("data:image/webp;base64,UklGRqwBAABXRUJQVlA4IKABAABQEACdASpgAGAAPhkMhEIhBBwEAGEtIBfeh8qPDVhwnXAECczwLWitfSiothFOOt4GtC4vttRdYHC2iWNrK1dG/2aZgk8WVaDUuSwPxQnnEn/Mn0MKdydjGgzfAtG6P8fQ9zwX7fAnGANxbEvlr01HFXvpCKEn4Blm9aQUziEtVDmXLNZShR8waieAAP7+K/+3+f83Pz+a05LFX/43j8ov0Q6y2uleh6LZ0GBzMIW5UrebAH805SwPPnilQhENg9jXaCnDqajOr0K6hmRir/viR21pKJrn7Mw2Rhz4bYN2oEL8QNYSAWla81/WGRCrhKCkNZJ1ixYjzzKO+U+l1TpYyU2jyPiI7EyBy41bVYCLbvXvufU4R4rnsWtQhsrhsGYav9NAe+dj+CVoOIvC1LBSbJrDpToleC1FrzlI9Q+Hg83FRuLDAHE0PkP2quEjKcCsiUiEctuZPW5C4wBPmRQwK5SdAW1eqOSmm1/kyifCmjOvj0RumAhqFwtwkS4cx6CgGKtdujZPA3fUNLTTHGHt/m+YsvUbWClljyxLSGZAAA==");          /* tiny clean background (no logo)         */
    --cursor: #f6b53a;              /* the morphing stroke colour (reference: yellow) */
    --cursor-glow: rgba(255,170,60,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0b0b;overflow:hidden}
  body{display:grid;place-items:center;-webkit-tap-highlight-color:transparent;cursor:pointer}

  /* ------- 9:16 stage, scaled to fit any screen by JS ------- */
  #stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#ecd0cb;
         transform-origin:center center;flex:none}

  /* ------- everything inside #world is in LOGO pixel space (1254 x 1254) ------- */
  #world{position:absolute;left:0;top:0;width:1254px;height:1254px;transform-origin:0 0;will-change:transform}
  .tile{position:absolute;width:1254px;height:1254px;background:var(--bg) 0 0/100% 100% no-repeat}
  .logo{position:absolute;background-image:var(--logo);background-repeat:no-repeat;background-size:1254px 1254px}

  /* soft edges so the pieces melt into the background */
  .feather-x{ -webkit-mask-image:linear-gradient(to right,transparent 0,#000 40px,#000 calc(100% - 40px),transparent 100%);
                      mask-image:linear-gradient(to right,transparent 0,#000 40px,#000 calc(100% - 40px),transparent 100%);}
  .feather-all{
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--f,60px),#000 calc(100% - var(--f,60px)),transparent 100%),
                       linear-gradient(to bottom,transparent 0,#000 var(--f,60px),#000 calc(100% - var(--f,60px)),transparent 100%);
    -webkit-mask-composite:source-in;
            mask-image:linear-gradient(to right,transparent 0,#000 var(--f,60px),#000 calc(100% - var(--f,60px)),transparent 100%),
                       linear-gradient(to bottom,transparent 0,#000 var(--f,60px),#000 calc(100% - var(--f,60px)),transparent 100%);
            mask-composite:intersect;}

  /* wordmark: outer = fixed shape (keeps the envelope out), inner = the moving reveal */
  #textClip{position:absolute;left:90px;top:700px;width:1080px;height:390px;background:none}
  #textClip .logo{left:0;top:0;width:100%;height:100%;background-position:-90px -700px}
  /* icon (envelope + heart) */
  #iconClip{position:absolute;left:150px;top:90px;width:980px;height:690px;background:none;opacity:0}
  #iconClip .logo{left:0;top:0;width:100%;height:100%;background-position:-150px -90px}
  /* the untouched, full logo that the animation finally settles on */
  #final{left:0;top:0;width:1254px;height:1254px;background-position:0 0;opacity:0;--f:150px}

  /* the morphing stroke */
  #cur{position:absolute;left:0;top:0;width:1254px;height:1254px;overflow:visible;
       filter:drop-shadow(0 0 10px var(--cursor-glow))}
  #cur path{fill:none;stroke:var(--cursor);stroke-linejoin:miter;stroke-miterlimit:8;stroke-linecap:butt}

  #black{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <!-- mirrored background tiles: the area around the logo is always seamless -->
    <div id="tiles"></div>

    <div id="final"  class="logo feather-all"></div>

    <div id="iconClip"><div id="icon" class="logo feather-all" style="--f:40px"></div></div>

    <div id="textClip"><div id="reveal" class="feather-all" style="position:absolute;inset:0;--f:40px"><div class="logo"></div></div></div>

    <svg id="cur" viewBox="0 0 1254 1254" aria-hidden="true">
      <defs><clipPath id="band"><rect id="bandRect" x="-2000" y="0" width="5000" height="10"/></clipPath></defs>
      <g clip-path="url(#band)"><path id="curPath" d=""/></g>
    </svg>
  </div>
  <div id="black"></div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   1.  MEASUREMENTS OF THE LOGO  (pixels of the 1254×1254 image)
   ============================================================ */
const K0 = 720 / 1254;            // logo -> screen scale when the whole logo fits the stage
const YT = 750, YB = 985;         // top / baseline of the wordmark
const H  = YB - YT;               // cap height  (= height of the moving stroke)
const SW = 0.155 * H;             // stroke thickness (reference: ~0.155 × height)
// letter boundaries:  W | i | s | h | T | a | l | e
const B  = [148, 455, 525, 622, 728, 822, 940, 1005, 1125];

/* ============================================================
   2.  TIMELINE (seconds)   – taken from the reference video
   ============================================================ */
const T_BLACK  = 0.40;            // fade in from black
const T_BAR0   = 0.20, T_BAR1 = 0.80;   // bar grows upward
const T_NB     = 0.97;            // bar -> first kinked bar
const S0       = 1.13;            // first Λ (letter 1 starts)
const D        = [0.36, 0.30, 0.30, 0.30, 0.32, 0.30, 0.28, 0.55]; // time per letter
const T_END    = S0 + D.reduce((a, b) => a + b, 0);                 // sweep finished (~3.84)
const T_ICON   = 4.00;            // icon pops in
const T_FINAL  = 4.65;            // cross-fade to the exact logo
const DUR      = 7.6;             // total length

/* ============================================================
   3.  SMALL HELPERS
   ============================================================ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp  = (a, b, t) => a + (b - a) * t;
const sm    = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const outC  = x => 1 - Math.pow(1 - clamp(x), 3);
const back  = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

/* ============================================================
   4.  THE MORPHING STROKE
       A shape = 5 points  [x (px), y (0 = top … 1 = baseline)]
   ============================================================ */
const BAR = (x, g) => [[x,1],[x,1-g/2],[x,1-g],[x,1-g/2],[x,1]];                       // plain bar
const NB  = x => [[x-.05*H,1],[x-.01*H,.52],[x+.03*H,0],[x+.11*H,.40],[x+.09*H,1]];   // bar with notch on the right
const LAM = (L, R, kink) => {                                                            // Λ spanning a letter
  const w  = clamp(R - L, .50*H, .82*H), cx = (L + R) / 2;
  const lf = cx - w/2, rf = cx + w/2, ap = cx - .08*w;
  const lm = (lf + ap) / 2, rm = (ap + rf) / 2;
  return kink ? [[lf-.10*w,.80],[lm+.04*w,.55],[ap,0],[rm,.50],[rf,1]]                // left foot lifted
              : [[lf,1],[lm,.50],[ap,0],[rm,.50],[rf,1]];
};
const SLB = R => { const x = R - .10*H;                                                 // collapsing to a slanted bar
  return [[x-.12*H,.76],[x-.04*H,.58],[x+.02*H,0],[x+.09*H,.42],[x+.07*H,1]]; };

/* keyframes: per letter  Λ  ->  Λ(kink)  ->  slanted bar  ->  notch bar  ->  next Λ */
const X0 = B[0] - .16 * H;
const KF = [ { t: T_BAR1, p: BAR(X0, 1) }, { t: T_NB, p: NB(X0) } ];
let tt = S0;
for (let k = 0; k < 8; k++) {
  const L = B[k], R = B[k+1], d = D[k];
  KF.push({ t: tt,           p: LAM(L, R, false) });
  KF.push({ t: tt + .40 * d, p: LAM(L, R, true)  });
  KF.push({ t: tt + .62 * d, p: SLB(R) });
  KF.push({ t: tt + .80 * d, p: NB(R - .10*H) });
  tt += d;
}
KF.push({ t: tt, p: NB(B[8] - .10*H) });

function cursorPts(t) {
  if (t <= T_BAR1) return BAR(X0, outC((t - T_BAR0) / (T_BAR1 - T_BAR0)));
  let i = 0; while (i < KF.length - 2 && t > KF[i+1].t) i++;
  const a = KF[i], b = KF[i+1], u = sm((t - a.t) / (b.t - a.t));
  return a.p.map((q, j) => [lerp(q[0], b.p[j][0], u), lerp(q[1], b.p[j][1], u)]);
}

/* reveal boundary that never moves backwards, and a smoothed camera anchor */
const STEP = 1 / 120, N = Math.ceil(DUR / STEP) + 2;
const COMMIT = new Float32Array(N), ANCHOR = new Float32Array(N);
(() => { let c = -1e9, a = X0;
  for (let i = 0; i < N; i++) {
    const p = cursorPts(i * STEP), off = SW/2 - 4;
    c = Math.max(c, Math.min(p[2][0], p[3][0], p[4][0]) + off);
    COMMIT[i] = c;
    a += (p[2][0] - a) * (1 - Math.exp(-STEP / .22));         // low-pass => calm camera
    ANCHOR[i] = a;
  } })();
const at = (arr, t) => arr[Math.min(N - 1, Math.max(0, Math.round(t / STEP)))];

/* ============================================================
   5.  CAMERA   (zoom values read from the reference: 1.0 -> 0.5, i.e. ~2× zoom-out)
   ============================================================ */
const ZOOM = [[0,1],[1.3,1],[1.5,.96],[2.0,.87],[2.33,.76],[2.67,.64],[3.0,.57],[3.4,.52],[4.0,.50]];
function zoomRef(t) {                       // reference zoom (1 … .5), time-stretched to our longer sweep
  t = t <= 1.3 ? t : 1.3 + (t - 1.3) / 1.1;
  if (t >= ZOOM[ZOOM.length-1][0]) return .5;
  let i = 0; while (t > ZOOM[i+1][0]) i++;
  return lerp(ZOOM[i][1], ZOOM[i+1][1], sm((t - ZOOM[i][0]) / (ZOOM[i+1][0] - ZOOM[i][0])));
}

/* ============================================================
   6.  DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const stage = $("stage"), world = $("world"), black = $("black");
const curPath = $("curPath"), bandRect = $("bandRect"), cur = $("cur");
const reveal = $("reveal"), textClip = $("textClip");
const iconClip = $("iconClip"), icon = $("icon"), fin = $("final");
bandRect.setAttribute("y", YT); bandRect.setAttribute("height", H);

// fixed outlines that keep the envelope out of the wordmark layer (and vice-versa)
const poly = pts => "polygon(" + pts.map(p => p[0] + "px " + p[1] + "px").join(",") + ")";
textClip.style.clipPath = poly([[0,35],[330,35],[405,36],[570,56],[670,58],[1080,58],[1080,390],[0,390]]);  // local to (90,700)
iconClip.style.clipPath = poly([[0,0],[980,0],[980,674],[610,674],[510,672],[345,652],[270,651],[0,651]]);  // local to (150,90)
iconClip.style.transformOrigin = "490px 670px";

// 3×3 mirrored background tiles
(() => { const w = $("tiles");
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const d = document.createElement("div"); d.className = "tile";
    d.style.left = i*1254 + "px"; d.style.top = j*1254 + "px";
    d.style.transform = `scale(${i ? -1 : 1},${j ? -1 : 1})`; w.appendChild(d);
  } })();

/* ============================================================
   7.  RENDER ONE MOMENT
   ============================================================ */
function render(t) {
  /* --- stroke --- */
  const p = cursorPts(t).map(q => [q[0], YT + q[1] * H]);
  const ext = (a, b) => {                           // lengthen end-points at the band edges so the clip cuts them flat
    const dy = a[1] - b[1];
    if (Math.abs(dy) < 1e-3) return a;
    const s = .12 * H / Math.abs(dy);
    if (a[1] >= YB - 1 && a[1] > b[1]) return [a[0] + (a[0]-b[0]) * s, a[1] + .12*H];
    if (a[1] <= YT + 1 && a[1] < b[1]) return [a[0] + (a[0]-b[0]) * s, a[1] - .12*H];
    return a;
  };
  const q = p.slice(); q[0] = ext(p[0], p[1]); q[4] = ext(p[4], p[3]);
  curPath.setAttribute("d", "M" + q.map(a => a[0].toFixed(1) + " " + a[1].toFixed(1)).join(" L"));
  curPath.setAttribute("stroke-width", SW.toFixed(1));
  const fadeIn  = sm((t - T_BAR0) / .15);
  const fadeOut = 1 - sm((t - (T_END + .05)) / .30);
  cur.style.opacity = fadeIn * fadeOut;

  /* --- wordmark reveal: everything left of the stroke's right edge --- */
  const off = SW / 2 - 4, cx = at(COMMIT, t);
  const bx = a => Math.max(a, cx);
  const poly2 = [
    [80, 640], [bx(p[2][0] + off), 640], [bx(p[2][0] + off), YT],
    [bx(p[3][0] + off), p[3][1]], [bx(p[4][0] + off), YB],
    [bx(p[4][0] + off), 1100], [80, 1100]
  ].map(a => [a[0] - 90, a[1] - 700]);               // -> local coordinates of #textClip
  reveal.style.clipPath = poly(poly2);
  reveal.style.visibility = t > T_NB - .05 ? "visible" : "hidden";

  /* --- camera --- */
  const s   = 1 + (zoomRef(t) - .5);                 // 1.5 (zoomed in) -> 1.0 (whole logo)
  const k   = K0 * s;
  const offp = 150 * sm((t - .93) / 1.3);            // where the stroke sits relative to the screen centre
  let camX  = at(ANCHOR, t) - offp / k;
  camX = lerp(camX, 636, sm((t - 2.4) / 1.5));       // glide to the centre of the wordmark
  camX = lerp(camX, 627, sm((t - 4.0) / 1.0));       // …then to the centre of the logo
  const camY = lerp((YT + YB) / 2, 627, sm((t - 3.9) / 1.1));
  world.style.transform = `translate(360px,640px) scale(${k}) translate(${-camX}px,${-camY}px)`;

  /* --- icon pops in --- */
  const u = (t - T_ICON) / .85;
  iconClip.style.opacity = sm(u * 1.7);
  iconClip.style.transform = `scale(${.55 + .45 * back(u)}) translateY(${(1 - outC(u)) * 40}px)`;

  /* --- settle on the exact logo --- */
  fin.style.opacity = sm((t - T_FINAL) / .55);

  /* --- fade in from black --- */
  black.style.opacity = 1 - sm(t / T_BLACK);
}

/* ============================================================
   8.  PLAYER
   ============================================================ */
function fit() { const s = Math.min(innerWidth / 720, innerHeight / 1280); stage.style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();

const params = new URLSearchParams(location.search);
const loop = !params.has("noloop");
let t0 = performance.now(), frozen = params.has("t") ? parseFloat(params.get("t")) : null;
function frame(now) {
  if (frozen === null) {
    let t = (now - t0) / 1000;
    if (t > DUR + .8) { if (!loop) { render(DUR); return; } t0 = now; t = 0; }
    render(Math.min(t, DUR));
  } else render(frozen);
  requestAnimationFrame(frame);
}
addEventListener("pointerdown", () => { frozen = null; t0 = performance.now(); });
window.seek = t => { frozen = t; render(t); };      // handy for debugging:  seek(2.1)
requestAnimationFrame(frame);
})();
</script>
</body>
