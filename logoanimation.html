<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WishTale – Intro Demo</title>

<!-- [INTRO] Failsafe + cover. Keep in <head>, before first paint. -->
<script>
(function (d) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  d.documentElement.classList.add("wt-intro-pending");
  setTimeout(function () {
    d.documentElement.classList.remove("wt-intro-pending", "wt-intro-mounted");
  }, 12000);
})(document);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ================= WishTale intro CSS (namespaced wt-*) ================= */
:root{
  --wt-bg-a:#fce6ea;
  --wt-bg-b:#f8d7e0;
  --wt-ink:#3b2d2c;
  --wt-tale:#b94a6c;
  --wt-coral:#ec8b78;
}
html.wt-intro-pending [data-wt-logo]{visibility:hidden !important}
html.wt-intro-pending:not(.wt-intro-mounted) body::before{
  content:"";position:fixed;inset:0;z-index:2147483000;
  background:radial-gradient(circle at 50% 45%,var(--wt-bg-a) 0%,var(--wt-bg-b) 75%);
}
#wt-intro{
  all:initial;
  position:fixed;inset:0;z-index:2147483001;display:block;overflow:hidden;
  touch-action:none;overscroll-behavior:contain;contain:layout paint style;
}
#wt-intro *{box-sizing:border-box;margin:0;padding:0}
#wt-intro .wt-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--wt-bg-a) 0%,var(--wt-bg-b) 75%)}
#wt-intro .wt-logo{
  position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;
  display:block;white-space:nowrap;line-height:1.15;font-style:normal;
  font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700;
  color:var(--wt-ink);text-rendering:geometricPrecision;
}
#wt-intro .wt-word{display:inline-block}
#wt-intro .wt-l{display:inline}
#wt-intro .wt-wi{color:var(--wt-ink)}
#wt-intro .wt-ta{color:var(--wt-tale)}
#wt-intro .wt-base{display:inline-block;width:0;height:0;vertical-align:baseline}
#wt-intro .wt-heart{display:inline-block;width:.62em;height:.58em;margin-left:.28em;vertical-align:-.02em;overflow:visible;opacity:0;transform-origin:50% 55%}
#wt-intro .wt-heart path{fill:none;stroke:var(--wt-ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#wt-intro .wt-cursor{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;opacity:0;filter:drop-shadow(0 0 .12em rgba(236,139,120,.6))}
#wt-intro .wt-cursor path{fill:none;stroke:var(--wt-coral);stroke-linejoin:miter;stroke-miterlimit:8;stroke-linecap:butt}
#wt-intro .wt-spark{position:absolute;pointer-events:none;opacity:0;overflow:visible;width:var(--s,.3em);height:var(--s,.3em);margin:calc(var(--s,.3em) / -2) 0 0 calc(var(--s,.3em) / -2)}

/* ================= DEMO PLACEHOLDER SITE – replace with your real website ================= */
*{box-sizing:border-box}
body{margin:0;background:#fdf7f2;color:#3b2d2c;font-family:Inter,system-ui,sans-serif}
.topbar{background:#f8d7e0;text-align:center;padding:.9rem 1rem;font-size:.95rem}
header.site{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem clamp(1rem,5vw,6rem);background:#fdf7f2;border-bottom:1px solid #f1e4dc}
nav.site-nav{display:flex;gap:1.6rem;align-items:center}
nav.site-nav a{color:#3b2d2c;text-decoration:none}
.btn{background:#ea8c7a;color:#fff!important;padding:.8rem 1.4rem;border-radius:999px;font-weight:500}
@media (max-width:860px){nav.site-nav a:not(.btn){display:none}}
.brand{display:inline-block;white-space:nowrap;line-height:1.15;text-decoration:none;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:2.1rem}
@media (max-width:560px){.brand{font-size:1.7rem}}
.brand .wt-wish{color:#3b2d2c}
.brand .wt-tale{color:#b94a6c}
.brand .wt-heart{display:inline-block;width:.62em;height:.58em;margin-left:.28em;vertical-align:-.02em;overflow:visible}
.brand .wt-heart path{fill:none;stroke:#3b2d2c;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.hero{padding:clamp(2rem,7vw,6rem) clamp(1rem,5vw,6rem)}
.hero h1{font-family:"Playfair Display",serif;font-size:clamp(2.4rem,7vw,5.2rem);line-height:1.05;margin:0 0 1rem;max-width:12em}
.hero h1 em{color:#b94a6c}
.hero p{max-width:34em;font-size:1.1rem;color:#5b4a48}
</style>
</head>
<body>
  <div class="topbar">Make someone's day extra special ♡</div>

  <header class="site">
    <!-- [INTEGRATION] header logo: needs data-wt-logo, .wt-wish, .wt-tale, .wt-heart -->
    <a class="brand" href="#" data-wt-logo aria-label="WishTale home"><span class="wt-wish">Wish</span><span class="wt-tale">Tale</span><svg class="wt-heart" viewBox="0 0 24 22" aria-hidden="true" focusable="false"><path d="M12 20.2C5.2 15 2 11.6 2 7.9 2 4.9 4.3 2.7 7.1 2.7c1.9 0 3.7 1 4.9 2.9 1.2-1.9 3-2.9 4.9-2.9C19.7 2.7 22 4.9 22 7.9c0 3.7-3.2 7.1-10 12.3z"/></svg></a>
    <nav class="site-nav">
      <a href="#">Home</a><a href="#">Occasions</a><a href="#">Templates</a><a href="#">How It Works</a>
      <a href="#">Reviews</a><a href="#">FAQ</a><a class="btn" href="#">Explore Templates</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Turn every moment into a <em>little page</em> to remember</h1>
    <p>Wedding invitations, birthday surprises, love letters, baby announcements and festival greetings, all in one sweet place.</p>
  </main>

<script>
/* WishTale logo intro – walking-legs version. Vanilla JS, no dependencies. */
(() => {
"use strict";
if (window.__wtIntro) return;
window.__wtIntro = true;

/* ---------------- config ---------------- */
const CFG = {
  headerLogoSelector: "[data-wt-logo]",
  startWidthMax: 560,
  startWidthVw: 0.8,
  fontWaitMs: 1500,
  safetyMs: 11000,
  lift: 0.34,                 // how high the swinging foot rises (× letter height)
  heart: "M12 20.2C5.2 15 2 11.6 2 7.9 2 4.9 4.3 2.7 7.1 2.7c1.9 0 3.7 1 4.9 2.9 1.2-1.9 3-2.9 4.9-2.9C19.7 2.7 22 4.9 22 7.9c0 3.7-3.2 7.1-10 12.3z"
};

/* ---------------- timeline (seconds) ---------------- */
const T_BAR0 = 0.30, T_BAR1 = 1.00;      // single bar grows up from the baseline
const S0 = 1.15;                         // first step begins
const D  = [0.55, 0.65, 0.55, 0.48, 0.50, 0.55, 0.50, 0.50, 0.60];   // duration of steps 0..8
const TS = []; { let a = S0; for (let i = 0; i < D.length; i++) { TS.push(a); a += D[i]; } }
const T_END = TS[8] + D[8];              // last step planted (~6.03s)
const T_H0 = 6.05, T_H1 = 6.85;          // heart draws on
const T_TR0 = 7.10, T_TR1 = 8.20;        // travel to header
const T_BG0 = 7.20, T_BG1 = 7.95;        // pink dissolves -> homepage appears
const T_DONE = T_TR1;

/* ---------------- helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp  = (a, b, t) => a + (b - a) * t;
const sm    = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const outC  = x => 1 - Math.pow(1 - clamp(x), 3);
const back  = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

const root = document.documentElement;
const PEND = "wt-intro-pending", MOUNT = "wt-intro-mounted";
let host = null, raf = 0, safety = 0, finished = false;
const undo = [];
const on = (t, ev, fn, o) => { t.addEventListener(ev, fn, o); undo.push(() => t.removeEventListener(ev, fn, o)); };

function finish() {
  if (finished) return;
  finished = true;
  cancelAnimationFrame(raf); clearTimeout(safety);
  undo.forEach(f => f());
  root.classList.remove(PEND, MOUNT);
  if (host) host.remove();
  window.dispatchEvent(new CustomEvent("wishtale:intro-complete"));
}

function boot() {
  const header = document.querySelector(CFG.headerLogoSelector);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!header || reduce || !document.body) { root.classList.remove(PEND, MOUNT); return; }
  run(header).catch(err => { console.warn("[WishTale intro] skipped:", err); finish(); });
}

async function run(header) {
  window.scrollTo(0, 0);

  /* ---------- build overlay ---------- */
  const mk = (txt, cls) => [...txt].map(c => `<span class="wt-l ${cls}">${c}</span>`).join("");
  host = document.createElement("div");
  host.id = "wt-intro";
  host.setAttribute("aria-hidden", "true");
  host.innerHTML =
    '<div class="wt-bg"></div>' +
    '<div class="wt-logo">' +
      '<span class="wt-word">' + mk("Wish", "wt-wi") + mk("Tale", "wt-ta") + '<i class="wt-base"></i></span>' +
      '<svg class="wt-heart" viewBox="0 0 24 22" focusable="false"><path d="' + CFG.heart + '"/></svg>' +
      '<svg class="wt-cursor" focusable="false"><defs><clipPath id="wt-band"><rect x="-2000" y="0" width="5000" height="10"/></clipPath></defs>' +
      '<g clip-path="url(#wt-band)"><path d=""/></g></svg>' +
    '</div>';
  document.body.appendChild(host);
  root.classList.add(MOUNT);
  safety = setTimeout(finish, CFG.safetyMs);

  const bg = host.querySelector(".wt-bg"), logo = host.querySelector(".wt-logo");
  const word = host.querySelector(".wt-word"), base = host.querySelector(".wt-base");
  const heart = host.querySelector(".wt-heart"), heartPath = heart.querySelector("path");
  const cur = host.querySelector(".wt-cursor"), curPath = cur.querySelector("g path");
  const bandRect = cur.querySelector("rect");
  const letters = [...host.querySelectorAll(".wt-l")];

  const SPARK_DEF = [[-.05,.14,.34,"#ec8b78",6.45],[.27,-.12,.22,"#f6a7b6",6.60],[.72,-.16,.30,"#ec8b78",6.70],
                     [1.02,.10,.20,"#ffffff",6.80],[1.07,.62,.30,"#f6a7b6",6.55],[.52,1.12,.20,"#ec8b78",6.90]];
  const sparks = SPARK_DEF.map(d => {
    const el = document.createElement("div");
    el.innerHTML = '<svg class="wt-spark" viewBox="-1 -1 2 2" style="--s:' + d[2] + 'em"><path fill="' + d[3] +
      '" d="M0-1C.08-.25.25-.08 1 0 .25.08.08.25 0 1-.08.25-.25.08-1 0-.25-.08-.08-.25 0-1z"/></svg>';
    const s = el.firstChild; logo.appendChild(s); return { s, fx: d[0], fy: d[1], t0: d[4] };
  });

  const fontSpec = () => { const c = getComputedStyle(header); return `${c.fontStyle} ${c.fontWeight} ${c.fontSize} ${c.fontFamily}`; };
  if (document.fonts && document.fonts.load) {
    await Promise.race([document.fonts.load(fontSpec(), "WishTale").catch(() => {}), new Promise(r => setTimeout(r, CFG.fontWaitMs))]);
  }
  if (finished) return;

  /* ---------- measurement (re-run on resize) ---------- */
  const M = {}; let F = [], COMMIT = null, X0 = 0;
  const STEP = 1 / 120, N = Math.ceil(T_DONE / STEP) + 3;
  const ctx = document.createElement("canvas").getContext("2d");
  M.hl = heartPath.getTotalLength ? heartPath.getTotalLength() : 60;
  heartPath.style.strokeDasharray = M.hl;

  function measure() {
    const c = getComputedStyle(header);
    logo.style.fontFamily = c.fontFamily; logo.style.fontSize = c.fontSize;
    logo.style.fontWeight = c.fontWeight; logo.style.letterSpacing = c.letterSpacing;
    const wi = header.querySelector(".wt-wish"), ta = header.querySelector(".wt-tale");
    if (wi) logo.style.setProperty("--wt-ink", getComputedStyle(wi).color);
    if (ta) logo.style.setProperty("--wt-tale", getComputedStyle(ta).color);

    M.w = logo.offsetWidth; M.h = logo.offsetHeight;
    M.B = letters.map(l => l.offsetLeft);
    const last = letters[letters.length - 1];
    M.B.push(last.offsetLeft + last.offsetWidth);
    M.base = base.offsetTop;
    M.wx = word.offsetLeft; M.wy = word.offsetTop;

    ctx.font = `${c.fontWeight} ${c.fontSize} ${c.fontFamily}`;
    const asc = ctx.measureText("l").actualBoundingBoxAscent;
    M.H  = asc > 2 ? asc : parseFloat(c.fontSize) * 0.74;
    M.YB = M.base; M.YT = M.base - M.H;
    M.SW = 0.16 * M.H;

    const vw = root.clientWidth || innerWidth, vh = innerHeight;
    M.s0 = Math.min(Math.min(vw * CFG.startWidthVw, CFG.startWidthMax) / M.w, (vh * 0.42) / M.h);

    cur.setAttribute("width", M.w); cur.setAttribute("height", M.h);
    bandRect.setAttribute("y", M.YT); bandRect.setAttribute("height", M.H);
    curPath.setAttribute("stroke-width", M.SW.toFixed(2));
    sparks.forEach(p => { p.s.style.left = p.fx * M.w + "px"; p.s.style.top = p.fy * M.h + "px"; });
    buildGait();
  }

  /* ---------- the walker ----------
     Footprints F: F[0] = start bar, F[1..8] = centres of W i s h T a l e, F[9] = just past the "e".
     Step j: one foot stays planted on F[j]; the other lifts from F[j-1], swings past it and lands on F[j+1].
     Feet alternate, so steps 0..8 are left, right, left, right … */
  function buildGait() {
    const { H, B } = M;
    X0 = B[0] - .16 * H;
    F = [X0];
    for (let k = 0; k < 8; k++) F.push((B[k] + B[k + 1]) / 2);
    F.push(B[8] + .35 * H);

    COMMIT = new Float32Array(N);               // reveal edge never moves backwards
    const off = .39 * M.SW; let c = -1e9;
    for (let i = 0; i < N; i++) {
      const p = walkPts(i * STEP);
      c = Math.max(c, Math.min(p[2][0], p[3][0], p[4][0]) + off);
      COMMIT[i] = c;
    }
  }
  /* 5 points rear foot → rear knee → hip → front knee → front foot (absolute px in logo space) */
  function walkPts(t) {
    const { H, YT, YB } = M;
    let hx, hy, fa, fb;
    if (t < S0) {                                // bar grows up, both "feet" together
      const g = outC((t - T_BAR0) / (T_BAR1 - T_BAR0));
      hx = X0; hy = YB - g * H; fa = [X0, YB]; fb = [X0, YB];
    } else {
      let j = 0; while (j < 8 && t >= TS[j + 1]) j++;
      const u  = clamp((t - TS[j]) / D[j]);
      const pl = F[j], a = F[Math.max(j - 1, 0)], b = F[j + 1];
      const k  = sm(clamp((u - .10) / .80));     // foot lifts first, then swings, then lands
      const mx = lerp(a, b, k);
      const my = YB - CFG.lift * H * Math.pow(Math.sin(Math.PI * u), .85);
      hx = (pl + mx) / 2; hy = YT;
      fa = [pl, YB]; fb = [mx, my];
    }
    const rear = fa[0] <= fb[0] ? fa : fb, front = rear === fa ? fb : fa;
    const mid = f => [(f[0] + hx) / 2, (f[1] + hy) / 2];
    return [rear, mid(rear), [hx, hy], mid(front), front];
  }
  const commitAt = t => COMMIT[Math.min(N - 1, Math.max(0, Math.round(t / STEP)))];

  /* ---------- render one moment ---------- */
  function render(t) {
    const { H, YT, YB, SW } = M;
    const vw = root.clientWidth || innerWidth, vh = innerHeight;

    /* legs */
    const p = walkPts(t);
    const ext = (a, b) => {                      // lengthen planted feet so the band clips them flat on the baseline
      const dy = a[1] - b[1]; if (Math.abs(dy) < 1e-3) return a;
      const s = .12 * H / Math.abs(dy);
      if (a[1] >= YB - 1 && a[1] > b[1]) return [a[0] + (a[0] - b[0]) * s, a[1] + .12 * H];
      if (a[1] <= YT + 1 && a[1] < b[1]) return [a[0] + (a[0] - b[0]) * s, a[1] - .12 * H];
      return a;
    };
    const q = p.slice(); q[0] = ext(p[0], p[1]); q[4] = ext(p[4], p[3]);
    curPath.setAttribute("d", "M" + q.map(a => a[0].toFixed(1) + " " + a[1].toFixed(1)).join(" L"));
    cur.style.opacity = sm((t - T_BAR0) / .5) * (1 - sm((t - T_END) / .35));

    /* letters are painted behind the front leg's right edge */
    if (t < T_BAR1 - .05) word.style.visibility = "hidden";
    else {
      word.style.visibility = "visible";
      if (t >= T_END + .30) word.style.clipPath = "none";
      else {
        const off = .39 * SW;
        let cx = commitAt(t);
        if (t > T_END) cx = lerp(cx, M.B[8] + H, sm((t - T_END) / .25));   // sweep the last sliver clean
        const bx = a => Math.max(a, cx);
        const top = YT - H, bot = YB + H, left = M.B[0] - 60;
        const pts = [[left, top], [bx(p[2][0] + off), top], [bx(p[2][0] + off), YT],
                     [bx(p[3][0] + off), YT + .5 * H], [bx(p[4][0] + off), YB],
                     [bx(p[4][0] + off), bot], [left, bot]]
          .map(a => (a[0] - M.wx).toFixed(1) + "px " + (a[1] - M.wy).toFixed(1) + "px");
        word.style.clipPath = "polygon(" + pts.join(",") + ")";
      }
    }

    /* heart draws on, then pops */
    const hu = clamp((t - T_H0) / (T_H1 - T_H0));
    heart.style.opacity = hu > 0 ? 1 : 0;
    heartPath.style.strokeDashoffset = (M.hl * (1 - outC(hu))).toFixed(2);
    heart.style.transform = `scale(${(.75 + .25 * back(hu)).toFixed(3)})`;

    /* sparkles */
    sparks.forEach(sp => {
      const u = (t - sp.t0) / .8;
      if (u <= 0 || u >= 1) { sp.s.style.opacity = 0; return; }
      const k = Math.sin(Math.PI * u);
      sp.s.style.opacity = k.toFixed(3);
      sp.s.style.transform = `scale(${(0.3 + .9 * k).toFixed(3)}) rotate(${(u * 90).toFixed(1)}deg)`;
    });

    /* position: centre (slow cinematic pull-back) -> live header rect */
    const sS = M.s0 * (1 + .12 * (1 - outC(t / 6)));
    const x0 = (vw - M.w * sS) / 2, y0 = (vh - M.h * sS) / 2;
    const e = inOut((t - T_TR0) / (T_TR1 - T_TR0));
    const hr = header.getBoundingClientRect();
    let sE, xE, yE;
    if (hr.width > 1 && hr.height > 1) { sE = hr.width / M.w; xE = hr.left; yE = hr.top + (hr.height - M.h * sE) / 2; }
    else { sE = M.s0 * .4; xE = 16; yE = 16; }
    const s = lerp(sS, sE, e), x = lerp(x0, xE, e), y = lerp(y0, yE, e);
    logo.style.opacity = 1;
    logo.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(5)})`;

    /* pink overlay dissolves while the logo travels => homepage appears */
    bg.style.opacity = (1 - sm((t - T_BG0) / (T_BG1 - T_BG0))).toFixed(3);
  }

  /* ---------- scroll lock ---------- */
  const stop = e => e.preventDefault();
  on(window, "wheel", stop, { passive: false });
  on(window, "touchmove", stop, { passive: false });
  on(window, "keydown", e => { if (["ArrowUp","ArrowDown","PageUp","PageDown","Home","End"," "].includes(e.key)) e.preventDefault(); });
  on(window, "resize", measure);
  on(window, "orientationchange", measure);

  measure();
  const t0 = performance.now();
  const tick = now => {
    if (finished) return;
    const t = Math.max(0, (now - t0) / 1000);
    if (t >= T_DONE) { render(T_DONE); finish(); return; }
    render(t);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, { once: true });
else boot();
})();
</script>
</body>
</html>
