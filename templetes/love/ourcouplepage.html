<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Us, In Our Own World</title>
<meta name="description" content="A little place on the internet that belongs to us.">
<meta name="theme-color" content="#0b0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
/* =========================================================
   US, IN OUR OWN WORLD — design system
   Colours are set from CONFIG.theme at runtime (see JS).
   ========================================================= */
:root{
  --ink:#0b0a0c; --ink2:#141115; --ivory:#f3ecdf; --paper:#ece2cd;
  --burg:#6d1f2f; --burg2:#8e3045; --silver:#b8b7bd; --champ:#c9a96a;
  --line:rgba(243,236,223,.16);
  --serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --script:'Homemade Apple','Segoe Script','Bradley Hand',cursive;
  --ease:cubic-bezier(.2,.7,.2,1);
  --pad:clamp(20px,5vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
html.lock{overflow:hidden}
body{background:var(--ink);color:var(--ivory);font:400 16px/1.65 var(--sans);overflow-x:clip;min-height:100vh}
body.on-cover{overflow:hidden}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
ul{list-style:none}
:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
section[tabindex="-1"]:focus{outline:none}
.light :focus-visible{outline-color:var(--burg)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
/* film grain */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.no-grain::after{display:none}

/* type + shared bits */
.eyebrow{font:500 11px/1.4 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--champ)}
.sec-title{font:400 clamp(40px,7.2vw,108px)/.95 var(--serif);letter-spacing:-.012em;margin:.3em 0 .3em}
.lede{max-width:56ch;color:var(--silver);font-size:1.05rem}
.sec{position:relative;padding:clamp(84px,12vw,176px) var(--pad)}
.wrap{max-width:1280px;margin:0 auto}
.sec-head{max-width:1280px;margin:0 auto clamp(40px,6vw,88px)}
.light{background:var(--paper);color:var(--ink);--line:rgba(11,10,12,.2);--silver:#5b5560;--champ:var(--burg)}
.btn{font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;padding:16px 24px;min-height:46px;border:1px solid currentColor;color:inherit;transition:background .3s,color .3s,transform .3s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:hover{background:var(--ivory);color:var(--ink)}
.light .btn:hover{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-solid{background:var(--burg);border-color:var(--burg);color:var(--ivory)}
.btn-solid:hover{background:var(--burg2);color:var(--ivory)}
.chip{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:12px 16px;min-height:42px;border:1px solid var(--line);color:inherit;transition:.25s}
.chip:hover{border-color:currentColor}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--champ);border-color:var(--champ);color:var(--ink)}
.light .chip[aria-pressed="true"]{color:var(--paper)}
.link-btn{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:12px 0;min-height:44px;border-bottom:1px solid currentColor;color:var(--champ)}
.js .rv:not(.in){opacity:0;transform:translateY(26px)}
.rv{transition:opacity 1s var(--ease),transform 1s var(--ease)}
.ph-img,img{object-fit:cover}

/* ---------- COVER ---------- */
#cover{position:fixed;inset:0;z-index:100;background:var(--ink);overflow:hidden;display:flex}
.cover-bg{position:absolute;inset:-4%;transition:transform .2s linear}
.cover-bg img{width:100%;height:100%;filter:saturate(.8) contrast(1.05) brightness(.7)}
.cover-fallback{position:absolute;inset:0;background:
  radial-gradient(60% 50% at 78% 22%,rgba(201,169,106,.28),transparent 70%),
  radial-gradient(70% 60% at 15% 85%,rgba(142,48,69,.55),transparent 70%),
  linear-gradient(160deg,#16101a,#0b0a0c 60%)}
.cover-fallback svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,12,.55),rgba(11,10,12,.1) 35%,rgba(11,10,12,.85))}
.cover-in{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,4vw,56px);padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));overflow-y:auto}
.cover-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cover-top span{font:500 11px/1.5 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--ivory)}
.cover-mid{margin:auto 0;padding:24px 0}
.cover-kick{font:500 12px/1 var(--sans);letter-spacing:.5em;text-transform:uppercase;color:var(--champ);margin-bottom:18px}
.cover-names{font:400 clamp(52px,13vw,200px)/.88 var(--serif);letter-spacing:-.02em;overflow-wrap:anywhere}
.cover-names i{font-style:italic;color:var(--champ);font-weight:400;padding:0 .08em}
.cover-line{font:italic 400 clamp(20px,2.6vw,34px)/1.3 var(--serif);color:var(--ivory);opacity:.9;margin-top:22px;max-width:30ch}
.cover-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
.counter{display:flex;gap:0;flex-wrap:wrap}
.counter .cell{padding:10px clamp(12px,2vw,26px);border-left:1px solid var(--line);min-width:64px}
.counter .cell:first-child{border-left:0;padding-left:0}
.counter b{display:block;font:400 clamp(30px,4.4vw,56px)/1 var(--serif);font-variant-numeric:tabular-nums}
.counter small{font:500 10px/1.6 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--silver)}
.counter-note{font:italic 400 20px/1.4 var(--serif);color:var(--silver);max-width:34ch}
.sample-tag{font:500 10px/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--champ);border:1px solid var(--champ);padding:5px 9px;display:inline-block}
.cover-curtain{position:absolute;top:0;bottom:0;width:50.5%;background:var(--ink);z-index:5;pointer-events:none;transform:translateX(-101%)}
.cover-curtain.r{right:0;transform:translateX(101%)}.cover-curtain.l{left:0}
.cover-curtain::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--champ)}
.cover-curtain.l::after{right:0}.cover-curtain.r::after{left:0}
#cover.opening .cover-curtain.l{animation:curL 1.5s var(--ease) forwards}
#cover.opening .cover-curtain.r{animation:curR 1.5s var(--ease) forwards}
@keyframes curL{0%{transform:translateX(-101%)}45%,52%{transform:translateX(0)}100%{transform:translateX(-101%)}}
@keyframes curR{0%{transform:translateX(101%)}45%,52%{transform:translateX(0)}100%{transform:translateX(101%)}}
#cover.opening .cover-in{transition:opacity .5s,transform .7s var(--ease);opacity:0;transform:scale(1.04)}
#cover.mid{background:transparent}
#cover.mid .cover-bg,#cover.mid .cover-shade,#cover.mid .cover-in{visibility:hidden}

/* ---------- TOPBAR + MENU ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,rgba(11,10,12,.78),transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.tb-left{display:flex;align-items:center;gap:14px;min-width:0}
.tb-label{font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;gap:6px}
.tb-btn{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:12px 14px;min-height:44px;border:1px solid var(--line);background:rgba(11,10,12,.55);backdrop-filter:blur(8px);color:var(--ivory)}
.tb-btn:hover{border-color:var(--champ)}
.menu{position:fixed;top:60px;right:var(--pad);z-index:60;width:min(92vw,380px);max-height:calc(100vh - 80px);max-height:calc(100dvh - 80px);overflow:auto;background:rgba(14,12,16,.97);border:1px solid var(--line);padding:10px 22px 18px;backdrop-filter:blur(14px)}
.menu a,.menu button.mi{display:flex;align-items:baseline;gap:16px;width:100%;text-align:left;padding:12px 0;min-height:46px;border-bottom:1px solid var(--line);color:var(--ivory);text-decoration:none;font:400 24px/1.2 var(--serif)}
.menu a small{font:500 10px/1 var(--sans);letter-spacing:.2em;color:var(--champ);min-width:24px}
.menu a[aria-current="true"]{color:var(--champ);font-style:italic}
.menu a:hover,.menu button.mi:hover{color:var(--champ)}
.menu .hint{font:400 11px/1.6 var(--sans);color:var(--silver);margin-top:12px}

/* ---------- MEET ---------- */
.meet-intro{max-width:1280px;margin:0 auto clamp(48px,7vw,110px);font:400 clamp(24px,3.4vw,46px)/1.25 var(--serif);max-width:26em;margin-left:max(0px,calc((100% - 1280px)/2))}
.profiles{max-width:1280px;margin:0 auto;display:grid;gap:clamp(70px,10vw,150px)}
.profile{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;align-items:center}
.portrait{grid-column:1/8;grid-row:1;position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line)}
.portrait>img{width:100%;height:112%;position:absolute;top:-6%;left:0;transform:translate3d(0,var(--py,0),0);transition:filter .8s,scale .9s var(--ease);filter:grayscale(.35) contrast(1.05)}
.portrait:hover>img{filter:none;scale:1.03}
.portrait figcaption{position:absolute;left:18px;bottom:14px;font:italic 400 28px/1 var(--serif);text-shadow:0 2px 12px #000}
.pbody{grid-column:7/13;grid-row:1;background:var(--ink2);border:1px solid var(--line);padding:clamp(24px,3.4vw,52px);position:relative;z-index:2;margin-top:clamp(60px,9vw,160px)}
.profile.flip .portrait{grid-column:6/13}
.profile.flip .pbody{grid-column:1/7;margin-top:0;margin-bottom:clamp(60px,9vw,160px);align-self:end}
.pname{font:400 clamp(44px,6vw,92px)/.92 var(--serif);margin:.2em 0 .1em}
.pnick{font:italic 400 24px/1 var(--serif);color:var(--champ)}
.pbio{color:var(--silver);margin:20px 0}
.favs{display:grid;grid-template-columns:auto 1fr;gap:0 22px;margin:18px 0 8px;font-size:.95rem}
.favs dt{font:500 10px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--champ);padding:10px 0;border-top:1px solid var(--line)}
.favs dd{padding:8px 0;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.fact.open{grid-template-rows:1fr}.fact>div{overflow:hidden}
.fact p{font:italic 400 22px/1.35 var(--serif);padding:14px 0 6px;border-left:2px solid var(--champ);padding-left:16px;margin-top:10px}
.worlds{max-width:1100px;margin:clamp(80px,12vw,180px) auto 0;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(40px,7vw,100px) 10px}
.worlds h3{font:400 clamp(32px,5vw,72px)/1 var(--serif);margin:14px 0 22px}
.worlds h3 em{color:var(--champ)}
.worlds p{max-width:60ch;margin:0 auto;color:var(--silver);font-size:1.05rem}

/* ---------- ATLAS ---------- */
.sec-atlas{background:radial-gradient(70% 40% at 90% 0,rgba(109,31,47,.35),transparent 70%),var(--ink2)}
.toolbar{max-width:1280px;margin:0 auto 28px;display:grid;gap:16px}
.tb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;border:1px solid var(--line)}
.tabs .chip{border:0;border-right:1px solid var(--line)}.tabs .chip:last-child{border-right:0}
.search{flex:1 1 220px;min-width:0;background:transparent;border:1px solid var(--line);padding:12px 16px;min-height:42px;color:var(--ivory)}
.search::placeholder{color:var(--silver)}
.stage{max-width:1280px;margin:0 auto;min-height:300px}
.status{font:400 13px/1.5 var(--sans);color:var(--silver);margin-bottom:16px}
.wall{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:110px;gap:14px;grid-auto-flow:dense}
.tile{position:relative;overflow:hidden;grid-column:span 2;grid-row:span 2;border:1px solid var(--line);text-align:left;background:var(--ink);transition:transform .5s var(--ease),box-shadow .5s,z-index 0s;box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
.tile.big{grid-column:span 3;grid-row:span 3}.tile.tall{grid-row:span 3}.tile.wide{grid-column:span 3}
.tile:nth-child(3n+1){transform:translateY(12px)}.tile:nth-child(4n+2){transform:translateY(-8px)}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) scale(1.015);z-index:3;box-shadow:0 30px 60px -20px #000}
.tile img{position:absolute;inset:0;width:100%;height:100%;transition:scale .9s var(--ease),filter .6s;filter:saturate(.85)}
.tile:hover img{scale:1.06;filter:none}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(11,10,12,.9));display:flex;flex-direction:column;gap:4px}
.cap small{font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--champ)}
.cap b{font:400 22px/1.1 var(--serif)}
.tl{position:relative;display:grid;gap:34px;padding-left:34px}
.tl::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line)}
.tl .yr{font:italic 400 44px/1 var(--serif);color:var(--champ)}
.tl-item{display:grid;grid-template-columns:120px 1fr;gap:20px;text-align:left;width:100%;position:relative;padding:6px 0;transition:transform .4s var(--ease)}
.tl-item:hover{transform:translateX(8px)}
.tl-item::before{content:"";position:absolute;left:-30px;top:18px;width:9px;height:9px;border:1px solid var(--champ);background:var(--ink2);border-radius:50%}
.tl-item img{width:120px;height:150px;border:1px solid var(--line)}
.tl-item small{font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--champ)}
.tl-item b{display:block;font:400 clamp(24px,3vw,38px)/1.1 var(--serif);margin:8px 0}
.tl-item p{color:var(--silver);max-width:60ch}
.places{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.map{position:relative;aspect-ratio:10/7;border:1px solid var(--line);background:#100e12;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;min-width:44px;min-height:44px;justify-content:flex-end;padding:4px;color:var(--ivory)}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--burg2);border:2px solid var(--ivory);transition:.3s;display:block}
.pin span{font:500 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:rgba(11,10,12,.8);padding:4px 7px;margin-bottom:5px;border:1px solid var(--line);white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.pin[aria-pressed="true"] i{background:var(--champ);scale:1.5;box-shadow:0 0 0 6px rgba(201,169,106,.25)}
.pin[aria-pressed="true"] span{border-color:var(--champ);color:var(--champ)}
.plist h3{font:400 40px/1 var(--serif);margin-bottom:14px}
.plist button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.plist button:hover b{color:var(--champ)}
.plist img{width:48px;height:60px;flex:none}
.plist b{font:400 22px/1.15 var(--serif);display:block}.plist small{color:var(--silver);font-size:12px}
.empty{padding:60px 20px;text-align:center;border:1px dashed var(--line);color:var(--silver)}
.empty p{font:italic 400 28px/1.2 var(--serif);margin-bottom:16px}

/* ---------- DIALOGS ---------- */
dialog.dlg{margin:auto;border:1px solid var(--line);background:var(--ink2);color:var(--ivory);padding:0;max-width:min(1080px,96vw);width:100%;max-height:94vh;max-height:94dvh;overflow:auto;overscroll-behavior:contain}
dialog.dlg::backdrop{background:rgba(5,4,6,.82);backdrop-filter:blur(6px)}
dialog.dlg[open]{animation:dlgIn .55s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.dlg-in{position:relative;padding:clamp(18px,3vw,40px)}
.dlg-x{position:absolute;top:8px;right:8px;width:46px;height:46px;border:1px solid var(--line);font:300 26px/1 var(--sans);z-index:3;background:rgba(11,10,12,.6)}
.dlg-x:hover{border-color:var(--champ);color:var(--champ)}
.mem-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,3vw,44px);align-items:start}
.mem-photo{display:block;width:100%;aspect-ratio:4/5;position:relative;overflow:hidden;border:1px solid var(--line)}
.mem-photo img{width:100%;height:100%}
.mem-photo::after{content:"View photo";position:absolute;right:10px;bottom:10px;font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;background:rgba(11,10,12,.75);padding:8px 10px}
.mem-text{padding-top:34px}.mem-text h2{font:400 clamp(34px,4.6vw,64px)/.98 var(--serif);margin:.25em 0 .3em}
.mem-text .place{font:500 11px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--champ);margin-bottom:16px}
.mem-text .cap2{font:italic 400 22px/1.35 var(--serif);color:var(--silver);margin-top:20px;padding-left:14px;border-left:2px solid var(--champ)}
.swap{animation:swap .6s var(--ease)}@keyframes swap{from{opacity:.0;transform:translateX(14px)}to{opacity:1;transform:none}}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.dlg-foot span{font:500 11px/1 var(--sans);letter-spacing:.2em;color:var(--silver)}
.ph-fig{display:grid;gap:12px;justify-items:center;padding-top:30px}
.ph-fig img{max-height:72vh;max-height:72dvh;width:auto;max-width:100%;object-fit:contain;border:1px solid var(--line)}
.ph-fig figcaption{font:italic 400 22px/1.3 var(--serif);text-align:center;color:var(--ivory)}
dialog.paper-dlg{max-width:min(640px,94vw);background:#f1e7d3;color:#2a2024;border-color:#cdbb97}
.paper-dlg .dlg-x{background:#f1e7d3;border-color:#cdbb97;color:#2a2024}
.paper-dlg .dlg-in{padding:clamp(32px,6vw,64px) clamp(24px,5vw,56px)}
.paper-dlg h2{font:italic 400 clamp(30px,5vw,46px)/1.05 var(--serif);color:var(--burg);margin-bottom:18px}
.paper-dlg p{font:400 clamp(20px,2.6vw,26px)/1.5 var(--serif);white-space:pre-line}
.paper-dlg .sig{font:400 15px/1.5 var(--script);color:var(--burg);margin-top:22px}

/* ---------- SCRAPBOOK ---------- */
.sec-scrapbook{background:var(--paper);background-image:radial-gradient(rgba(11,10,12,.07) 1px,transparent 1.2px);background-size:22px 22px}
.sb-actions{max-width:1280px;margin:0 auto 40px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.board{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(24px,4vw,56px) 16px;padding-bottom:30px}
.sb{position:relative;grid-column:span 4;transform:rotate(var(--r,0deg));transition:transform .5s var(--ease)}
.sb:nth-child(5n+1){grid-column:2/7}.sb:nth-child(5n+2){grid-column:7/12;margin-top:50px}.sb:nth-child(5n+3){grid-column:1/5}
.sb:nth-child(5n+4){grid-column:5/10;margin-top:-30px}.sb:nth-child(5n+5){grid-column:9/13}
.sb:hover{transform:rotate(0) translateY(-4px);z-index:4}
.sb.dealt{animation:deal .9s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(calc(var(--r) * 3)) scale(.92)}to{opacity:1;transform:rotate(var(--r))}}
.sb-photo{display:block;width:100%;overflow:hidden;position:relative;background:#222}
.sb-photo img{width:100%;height:100%}
.sb-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}
.sb-hand{font:400 14px/1.6 var(--script);color:#3a2a2e;margin-top:10px}
.stamp{display:inline-block;font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;border:1.5px solid var(--burg);color:var(--burg);padding:6px 8px;transform:rotate(-4deg);opacity:.85}
.note-btn{margin-top:8px;font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--burg);border-bottom:1px solid var(--burg);padding:12px 0;min-height:44px}
.note{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}.note.open{grid-template-rows:1fr}.note>div{overflow:hidden}
.note p{background:#fbf6a8;background:linear-gradient(#fbf3b4,#f4e993);padding:14px 16px;font:400 13px/1.7 var(--script);box-shadow:2px 4px 10px rgba(0,0,0,.15);margin-top:6px;color:#3a2a2e;transform:rotate(-1deg)}
/* layout treatments */
.sb-polaroid{background:#fbf8f1;padding:14px 14px 22px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}.sb-polaroid .sb-photo{aspect-ratio:1/1}
.sb-strip{background:#111;padding:12px 10px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);color:#eee}.sb-strip .sb-photo{aspect-ratio:3/4}.sb-strip .sb-hand{color:#ddd}
.sb-postcard{background:#f6efdc;padding:14px;border:1px solid #cdbb97;box-shadow:0 14px 30px -10px rgba(0,0,0,.35);display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.sb-postcard .sb-photo{aspect-ratio:4/3;grid-column:1/-1}
.sb-taped{padding:0}.sb-taped::before{content:"";position:absolute;top:-14px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(-3deg);background:rgba(201,169,106,.55);z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sb-taped .sb-photo{aspect-ratio:4/5;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.sb-ticket{background:#efe3c8;padding:14px 14px 16px;border-top:2px dashed var(--burg);border-bottom:2px dashed var(--burg);box-shadow:0 12px 26px -12px rgba(0,0,0,.35)}.sb-ticket .sb-photo{aspect-ratio:16/10}
.sb-torn{background:#fff;padding:10px;box-shadow:0 14px 30px -10px rgba(0,0,0,.35);clip-path:polygon(0 2%,6% 0,14% 2%,24% 0,38% 2%,52% 0,66% 2%,80% 0,92% 2%,100% 0,100% 98%,92% 100%,80% 98%,66% 100%,52% 98%,38% 100%,24% 98%,12% 100%,0 98%)}.sb-torn .sb-photo{aspect-ratio:5/4}

/* ---------- SOUNDTRACK ---------- */
.tracks{max-width:1100px;margin:0 auto}
.track{display:grid;grid-template-columns:70px 150px 1fr;gap:clamp(14px,3vw,36px);padding:30px 0;border-top:1px solid var(--line);align-items:start}
.track:last-child{border-bottom:1px solid var(--line)}
.track .no{font:italic 400 56px/1 var(--serif);color:var(--champ)}
.track .art{aspect-ratio:1;border:1px solid var(--line);overflow:hidden}.track .art img{width:100%;height:100%}
.track.playing .art{box-shadow:0 0 0 1px var(--champ),0 0 40px rgba(201,169,106,.3)}
.track h3{font:400 clamp(28px,3.6vw,48px)/1 var(--serif)}
.track .by{font:500 11px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--champ);margin:8px 0 14px}
.track .why{color:var(--silver);max-width:60ch;font-size:1.02rem}.track .why::before{content:"Why it matters — ";font:italic 400 18px var(--serif);color:var(--ivory)}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:18px}
.player input[type=range]{accent-color:var(--champ);height:44px;min-width:0}
.player .prog{flex:1 1 200px}.player .vol{width:100px}
.player time{font:500 11px/1 var(--sans);letter-spacing:.1em;color:var(--silver);font-variant-numeric:tabular-nums}
.noaudio{margin-top:16px;font:400 13px/1.6 var(--sans);color:var(--silver);border-left:2px solid var(--line);padding-left:12px}
.perr{color:#e6a0a8}

/* ---------- HISTORY ---------- */
.sec-history{background:linear-gradient(180deg,#1a0c11,#240f17 50%,#140a0e)}
.hist-ctrl{max-width:1280px;margin:0 auto 30px;display:grid;gap:16px}
.jump{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.jump label{display:grid;gap:6px;font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--champ)}
.jump input{background:transparent;border:1px solid var(--line);padding:10px 12px;min-height:44px;color-scheme:dark}
.hist-main{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:clamp(24px,4vw,64px);align-items:start}
.cal{border:1px solid var(--line);padding:18px;background:rgba(11,10,12,.4)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head b{font:italic 400 30px/1 var(--serif)}
.cal-head button{width:44px;height:44px;border:1px solid var(--line)}.cal-head button:hover{border-color:var(--champ)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .dow{font:500 10px/2.4 var(--sans);letter-spacing:.14em;color:var(--silver);text-transform:uppercase}
.cal-grid .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:400 15px var(--sans);color:var(--silver);position:relative;min-height:36px}
.cal-grid button.d{color:var(--ivory);background:rgba(142,48,69,.45);border:1px solid var(--burg2)}
.cal-grid button.d:hover{background:var(--burg2)}
.cal-grid button.d[aria-pressed="true"]{background:var(--champ);color:var(--ink);border-color:var(--champ)}
.cal-grid .picked{outline:1px dashed var(--champ);outline-offset:-3px}
.cal-note{font-size:12px;color:var(--silver);margin-top:12px;min-height:20px}
.mdetail{border-top:1px solid var(--line);padding-top:24px}
.mdetail .bigdate{font:italic 400 clamp(26px,3vw,40px)/1 var(--serif);color:var(--champ)}
.mdetail h3{font:400 clamp(38px,5.4vw,78px)/.95 var(--serif);margin:.2em 0 .3em}
.mdetail p{color:var(--silver);max-width:56ch;font-size:1.05rem}
.mdetail .mp{width:min(100%,380px);aspect-ratio:4/3;margin-top:20px;border:1px solid var(--line)}.mdetail .mp img{width:100%;height:100%}
.mnav{display:flex;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap}.mnav span{font:500 11px/1 var(--sans);letter-spacing:.2em;color:var(--silver)}
.ribbon{max-width:1280px;margin:40px auto 0;display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.ribbon button{flex:none;scroll-snap-align:start;border:1px solid var(--line);padding:14px 18px;text-align:left;min-width:170px;min-height:64px}
.ribbon button small{display:block;font:500 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--champ);margin-bottom:6px}
.ribbon button[aria-current="true"]{background:var(--champ);color:var(--ink);border-color:var(--champ)}.ribbon button[aria-current="true"] small{color:var(--ink)}

/* ---------- BUCKET ---------- */
.prog-wrap{max-width:1280px;margin:0 auto 30px;display:grid;gap:12px}
.pbar{height:6px;background:var(--line);position:relative;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--burg2),var(--champ));transition:width .8s var(--ease);display:block}
.pnum{font:italic 400 clamp(36px,5vw,64px)/1 var(--serif)}.pnum small{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--silver);font-style:normal;margin-left:10px}
.store-note{max-width:1280px;margin:0 auto 26px;font-size:13px;color:var(--silver);border-left:2px solid var(--champ);padding-left:14px}
.bucket{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:0 clamp(24px,5vw,80px)}
.bk{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line);position:relative}
.bk input{position:absolute;opacity:0;width:44px;height:44px;margin:0;cursor:pointer;z-index:2}
.bk .box{width:34px;height:34px;border:1px solid var(--silver);display:flex;align-items:center;justify-content:center;transition:.3s;margin-top:4px}
.bk .box svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.4;fill:none;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .5s var(--ease)}
.bk input:checked~.box{background:var(--champ);border-color:var(--champ)}.bk input:checked~.box svg{stroke-dashoffset:0}
.bk input:focus-visible~.box{outline:2px solid var(--champ);outline-offset:3px}
.bk h3{font:400 clamp(24px,2.8vw,34px)/1.1 var(--serif);transition:.4s}
.bk.done h3{text-decoration:line-through;text-decoration-color:var(--champ);color:var(--silver)}
.bk p{color:var(--silver);font-size:.95rem;margin:6px 0}
.bk .meta{font:500 10px/1.6 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--champ)}
.bk .done-mark{display:none;font:italic 400 18px var(--serif);color:var(--champ)}.bk.done .done-mark{display:inline;animation:swap .6s var(--ease)}
.bk.pop{animation:pop .6s var(--ease)}@keyframes pop{40%{transform:scale(1.025);background:rgba(201,169,106,.12)}}

/* ---------- QUIZ ---------- */
.quiz-box{max-width:860px;margin:0 auto;border:1px solid var(--line);padding:clamp(24px,5vw,64px);background:rgba(255,255,255,.35)}
.qprog{display:flex;justify-content:space-between;font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.qbar{height:4px;background:var(--line);margin-bottom:34px}.qbar i{display:block;height:100%;background:var(--burg);transition:width .5s var(--ease)}
.quiz-box fieldset{border:0;min-width:0}
.quiz-box legend{font:400 clamp(30px,4.4vw,54px)/1.05 var(--serif);margin-bottom:26px;padding:0}
.opt{display:flex;align-items:center;gap:16px;padding:16px 18px;min-height:56px;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.25s;font:400 22px/1.2 var(--serif);background:rgba(255,255,255,.35)}
.opt:hover{border-color:var(--burg)}
.opt input{accent-color:var(--burg);width:18px;height:18px;flex:none}
.opt:has(input:checked){background:var(--burg);color:var(--paper);border-color:var(--burg)}
.opt:has(input:focus-visible){outline:2px solid var(--burg);outline-offset:3px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.score{font:italic 400 clamp(80px,16vw,190px)/.9 var(--serif);color:var(--burg)}
.score small{font-size:.3em;color:var(--silver)}
.qres h3{font:400 clamp(30px,4vw,52px)/1.05 var(--serif);margin:14px 0}
.qres p{max-width:54ch}
.review{margin:28px 0;border-top:1px solid var(--line)}
.review li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.review b{font:500 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--burg);display:block;margin-bottom:4px}

/* ---------- SECRETS ---------- */
.sec-secrets{background:radial-gradient(50% 50% at 50% 40%,rgba(109,31,47,.4),transparent 70%),var(--ink)}
.env-row{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:clamp(20px,3vw,40px)}
.env{position:relative;aspect-ratio:3/2;text-align:left;perspective:600px}
.env:nth-child(odd){transform:rotate(-1.6deg)}.env:nth-child(even){transform:rotate(1.4deg) translateY(14px)}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#e8dcc2,#d6c6a4);box-shadow:0 20px 36px -14px #000;border:1px solid #bda97c}
.env .flap{position:absolute;left:0;right:0;top:0;height:55%;background:linear-gradient(#ddcfaf,#cdbb97);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s var(--ease);z-index:2;border-top:1px solid #bda97c}
.env .seal{position:absolute;left:50%;top:48%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--burg2),var(--burg));z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:.4s}
.env:hover .flap,.env:focus-visible .flap,.env.opened .flap{transform:rotateX(150deg)}.env.opened .seal,.env:hover .seal{opacity:0}
.env .lab{position:absolute;left:14px;right:14px;bottom:14px;z-index:1;font:400 20px/1.15 var(--serif);color:#3a2a2e}
.env .lab small{display:block;font:500 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--burg);margin-bottom:5px}
.egg-wrap{max-width:1280px;margin:60px auto 0;display:flex;align-items:center;gap:14px;color:var(--silver);font-size:13px}
.egg{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--champ);transition:.3s}
.egg:hover{border-color:var(--champ);rotate:72deg}.egg svg{width:16px;height:16px;fill:currentColor}

/* ---------- LETTER ---------- */
.sec-letter{background:radial-gradient(60% 40% at 50% 0,rgba(201,169,106,.12),transparent 70%),#100d11}
.paper{position:relative;max-width:840px;margin:0 auto;background:linear-gradient(#f3e9d5,#eadfc6);color:#2a2024;padding:clamp(34px,8vw,108px);box-shadow:0 50px 90px -30px #000;border:1px solid #cdbb97}
.paper::before{content:"";position:absolute;inset:14px;border:1px solid rgba(109,31,47,.3);pointer-events:none}
.paper .seal2{position:absolute;right:clamp(20px,5vw,60px);top:-24px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--burg2),var(--burg));display:flex;align-items:center;justify-content:center;font:italic 400 24px var(--serif);color:#f3e9d5;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.l-date{font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--burg);margin-bottom:34px}
.l-greet{font:italic 400 clamp(34px,5vw,60px)/1.05 var(--serif);color:var(--burg);margin-bottom:26px}
.paper p.ln{font:400 clamp(20px,2.3vw,25px)/1.62 var(--serif);margin-bottom:1.1em}
.l-mem,.l-wish{margin:34px 0;padding:6px 0 6px 22px;border-left:2px solid var(--burg)}
.l-mem h3,.l-wish h3{font:500 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--burg);margin-bottom:10px}
.l-sig{font:400 clamp(22px,3vw,34px)/1.4 var(--script);color:var(--burg);margin-top:38px}
.l-closing{margin-top:34px;font:italic 400 24px var(--serif)}
.l-photo{margin:40px auto 0;width:min(280px,80%);background:#fbf8f1;padding:10px 10px 28px;transform:rotate(2deg);box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}.l-photo img{aspect-ratio:1;width:100%}
.letter-actions{max-width:840px;margin:34px auto 0;text-align:center}
.play .ln,.play .l-greet,.play .l-mem,.play .l-wish,.play .l-sig,.play .l-closing{animation:rise 1.1s var(--ease) backwards;animation-delay:calc(var(--i,0)*.22s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- CLOSING ---------- */
.closing{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:clamp(80px,12vw,160px) var(--pad);text-align:center;background:#12080b}
.closing .bg{position:absolute;inset:-6%;transform:translate3d(0,var(--py,0),0)}
.closing .bg img{width:100%;height:100%;filter:blur(3px) brightness(.38) saturate(.8)}
.closing::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(60% 60% at 50% 45%,rgba(109,31,47,.55),rgba(11,10,12,.9) 80%)}
.closing .in{position:relative;z-index:2;max-width:900px}
.c-frame{width:min(240px,60vw);margin:0 auto 38px;padding:10px 10px 30px;background:#fbf8f1;transform:rotate(-2.5deg);box-shadow:0 30px 60px -20px #000;color:#3a2a2e}
.c-frame img{aspect-ratio:4/5;width:100%}.c-frame small{display:block;margin-top:8px;font:400 12px/1.3 var(--script)}
.c-names{font:400 clamp(44px,9vw,128px)/.92 var(--serif)}.c-names i{color:var(--champ);padding:0 .1em}
.c-msg{margin:34px auto;max-width:22em;font:italic 400 clamp(26px,3.8vw,48px)/1.2 var(--serif)}
.c-msg span{display:block}
.closing.play .c-msg span{animation:rise 1.2s var(--ease) backwards;animation-delay:calc(var(--i)*.5s + .3s)}
.c-act{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.c-nav{margin-top:44px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.c-nav button{font:500 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--silver);padding:14px 10px;min-height:44px}.c-nav button:hover{color:var(--champ)}
footer.foot{padding:30px var(--pad);text-align:center;font-size:12px;color:var(--silver);background:#0a0709}

/* ---------- RESPONSIVE ---------- */
@media (max-width:980px){
  .profile,.profile.flip{display:block}
  .pbody,.profile.flip .pbody{margin:-60px 14px 0}
  .portrait,.profile.flip .portrait{width:88%;margin-left:0}.profile.flip .portrait{margin-left:auto}
  .wall{grid-template-columns:repeat(4,1fr);grid-auto-rows:96px}
  .places{grid-template-columns:1fr}
  .hist-main{grid-template-columns:1fr}
  .bucket{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(6,1fr)}
  .sb,.sb:nth-child(n){grid-column:span 3;margin-top:0}.sb:nth-child(2n){margin-top:40px}
  .mem-grid{grid-template-columns:1fr}.mem-text{padding-top:0}.mem-photo{aspect-ratio:4/3}
}
@media (max-width:620px){
  body{font-size:15.5px}
  .tb-label{display:none}
  .tb-btn{padding:12px 11px;letter-spacing:.14em}
  .wall{grid-template-columns:repeat(2,1fr);grid-auto-rows:92px;gap:10px}
  .tile,.tile.wide{grid-column:span 1;grid-row:span 2}.tile.big,.tile.tall{grid-column:span 2;grid-row:span 3}
  .tile:nth-child(n){transform:none}
  .tl{padding-left:24px}.tl-item{grid-template-columns:84px 1fr;gap:12px}.tl-item img{width:84px;height:108px}.tl-item::before{left:-24px}
  .board{display:flex;flex-direction:column;gap:34px}
  .sb,.sb:nth-child(n){width:88%;margin-top:0}.sb:nth-child(even){align-self:flex-end}
  .sb-postcard{grid-template-columns:1fr}
  .track{grid-template-columns:44px 1fr;grid-template-areas:"no art" "body body"}
  .track .no{font-size:38px;grid-area:no}.track .art{grid-area:art;width:110px}.track .body{grid-area:body}
  .player .vol{width:84px}
  .cal{padding:10px}.cal-grid{gap:2px}
  .opt{font-size:19px;padding:14px}
  .dlg-foot{flex-wrap:wrap}.dlg-foot .btn{flex:1}
  .counter .cell{min-width:0;padding:8px 12px}
  .cover-bot{align-items:flex-start}
  .env:nth-child(n){transform:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .js .rv:not(.in){opacity:1;transform:none}
}
</style>

function diffParts(a,b){ // a <= b

  const hr=Math.floor(ms/36e5);ms-=hr*36e5;const mi=Math.floor(ms/6e4);ms-=mi*6e4;

  if(RM)return;
  const els=$$('[data-par]');let tick=false;
  parallaxUpdate=function(){tick=false;const vh=innerHeight;els.forEach(el=>{const p=el.parentElement.getBoundingClientRect();if(p.bottom<-200||p.top>vh+200)return;
    el.style.setProperty('--py',(((p.top+p.height/2)-vh/2)*parseFloat(el.dataset.par)).toFixed(1)+'px')})};
  addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(parallaxUpdate)}},{passive:true});
}

/* ---------- footer ---------- */
function buildFooter(){$('#foot').textContent=(CONFIG.siteTitle||'')+' — '+A+' & '+B+'. '+(CONFIG.tagline||'')}

/* ---------- boot ---------- */
function init(){
  buildCover();tickCounter();setInterval(tickCounter,1000);
  const builders={meet:buildMeet,atlas:buildAtlas,scrapbook:buildScrapbook,soundtrack:buildSoundtrack,history:buildHistory,bucket:buildBucket,quiz:buildQuiz,secrets:buildSecrets,letter:buildLetter,closing:buildClosing};
  const main=$('#main');
  SECS.forEach(s=>{if(builders[s.id]){try{main.append(builders[s.id]())}catch(err){console.error('Section "'+s.id+'" failed to build:',err)}}});
  renderAtlas();renderScrap(false);renderHist();renderBucket();qs.started=false;renderQuiz(false);qs.started=true;
  buildNav();buildFooter();trackActive();setupMotion();
}
init();
})();
</script>
</body>
